<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" type="image/svg+xml" href="{{ url_for('static', filename='images/globsoft.svg') }}">
  <title>Sign In - Globsoft Tech</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0d18;
      background-image: radial-gradient(circle at 50% 20%, rgba(121, 255, 247, 0.08) 0%, transparent 60%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .brand-header {
      margin-bottom: 24px;
      text-align: center;
    }
    .brand-header img {
      width: 44px;
      height: 44px;
      margin-bottom: 8px;
    }
    .brand-header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    #clerk-sign-in {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 460px;
    }
  </style>

  {% if clerk_publishable_key %}
  <!-- Official Clerk JS SDK -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="{{ clerk_publishable_key }}"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript">
  </script>
  {% endif %}
</head>
<body>
  <div class="brand-header">
    <img src="{{ url_for('static', filename='images/globsoft.svg') }}" alt="Globsoft Tech">
    <h1>Globsoft Tech Admin Portal</h1>
  </div>

  <!-- Official Default Clerk Sign-In Component Container -->
  <div id="clerk-sign-in"></div>

  <script>
    const isLoggedOut = new URLSearchParams(window.location.search).has('logged_out');

    async function syncUser(user) {
      if (!user) return;
      const email = (user.primaryEmailAddress && user.primaryEmailAddress.emailAddress)
        || (user.emailAddresses && user.emailAddresses[0] && user.emailAddresses[0].emailAddress)
        || '';
      const name = user.fullName || [user.firstName, user.lastName].filter(Boolean).join(' ') || (email ? email.split('@')[0] : 'Author');
      const imageUrl = user.imageUrl || '';
      const clerkId = user.id || '';

      if (!email) return;

      try {
        const res = await fetch('/api/auth/clerk-session', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            name: name,
            image_url: imageUrl,
            clerk_id: clerkId,
          }),
        });
        const data = await res.json();
        if (data && data.success && data.redirect) {
          window.location.href = data.redirect;
        } else {
          window.location.href = '/';
        }
      } catch (err) {
        console.error('Session sync error:', err);
        window.location.href = '/';
      }
    }

    window.addEventListener('load', async () => {
      if (!window.Clerk) return;

      try {
        await window.Clerk.load();

        if (isLoggedOut) {
          try {
            await window.Clerk.signOut();
          } catch (e) {}
          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        }

        // Listen for user completing sign-in inside Clerk's component
        if (typeof window.Clerk.addListener === 'function') {
          window.Clerk.addListener(async ({ user }) => {
            if (user && !isLoggedOut) {
              await syncUser(user);
            }
          });
        }

        // If user is already signed in
        if (window.Clerk.user && !isLoggedOut) {
          await syncUser(window.Clerk.user);
          return;
        }

        function mountAuth() {
          const mountTarget = document.getElementById('clerk-sign-in');
          if (!mountTarget) return;

          mountTarget.innerHTML = '';
          const isSignUp = window.location.hash.includes('sign-up');

          if (isSignUp && typeof window.Clerk.mountSignUp === 'function') {
            window.Clerk.mountSignUp(mountTarget, {
              routing: 'hash',
              signInUrl: '#/sign-in',
              afterSignUpUrl: '/',
            });
          } else if (typeof window.Clerk.mountSignIn === 'function') {
            window.Clerk.mountSignIn(mountTarget, {
              routing: 'hash',
              signUpUrl: '#/sign-up',
              afterSignInUrl: '/',
            });
          }
        }

        mountAuth();
        window.addEventListener('hashchange', mountAuth);
      } catch (err) {
        console.error('Clerk initialization error:', err);
      }
    });
  </script>
</body>
</html>
